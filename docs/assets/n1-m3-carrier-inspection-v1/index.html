<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>N1 M3承载核查</title><style>body{font:18px sans-serif;background:#101a27;color:#eee;max-width:1500px;margin:24px auto}img{max-width:100%}a{color:#8dd6ff}button{font:inherit;margin:8px}</style><h1>N1：只核对上层M3承载</h1><p>N1的V2身份已审。首选为A/C-M3-L01；跨帧精确对应仍需人工裁决。以下是独立原生照片并列，没有投影。</p><p>孔数、落点、几何修订和完整孔组包围均未批准。05/06局部不直连的裁决保留。</p><h2>宽范围与放大图</h2><img src="carrier-wide-pair.png" alt="M2 M3宽图"><img src="carrier-detail-pair.png" alt="M2 M3放大并列"><h2>原图与标注切换</h2><button onclick="raw=!raw;document.querySelectorAll('[data-source]').forEach(e=>e.src=e.dataset.source.replace('MODE',raw?'raw':'marked'))">切换原图/标注</button><select id="layer" onchange="document.querySelectorAll('[data-layer]').forEach(e=>e.hidden=e.dataset.layer!==this.value)"><option value="m2">M2</option><option value="m3">M3</option></select><div data-layer="m2"><img data-source="m2-detail-MODE.png" src="m2-detail-marked.png"></div><div data-layer="m3" hidden><img data-source="m3-detail-MODE.png" src="m3-detail-marked.png"></div><h2>设计诊断：没有新增孔</h2><p>蓝色M2短头与紫色候选A的共同材料高度仅2设计像素；按当前孔径6、每侧包围1，至少需要8。不能把孔移到竖干凑通过。完整孔组包围尚未评估。</p><img src="design-overlap-diagnostic.png"><p>下一步：先裁决A承载，再定位完整来源孔组并作有来源依据的局部几何修订。</p><script>let raw=false;</script></html>
