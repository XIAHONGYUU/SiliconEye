<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>03／04短横头V2身份复核</title><style>body{max-width:1500px;margin:24px auto;background:#101a27;color:#eee;font:18px/1.6 sans-serif}img{max-width:100%}button,select{font:inherit;margin:8px}a{color:#8dd6ff}.note{padding:14px;border-left:5px solid #ffb04f;background:#233448}</style><h1>03／04：先核V2身份，再查M3承载</h1><p class="note">AI倾向两处为V2候选，但短横头亮面与拍屏网格仍有歧义。本次只确认孔层身份，不要求数孔，不批准M3或新增几何。N1和U1是已审参照，不重新索取批准。</p><h2>宽范围与同倍率局部原图</h2><img src="wide-identity-context.png" alt="M2宽范围"><img src="native-detail-comparison.png" alt="03 04 N1局部原图"><h2>原图／标注切换</h2><select id="part"><option>03</option><option>04</option><option>N1</option><option value="m3-context">M3结构参照（非承载结论）</option></select><button id="toggle">切换原图／标注</button><img id="detail" src="03/m2-detail-raw.png"><h2>仅两项身份问题</h2><p>Q1：03橙框短横头亮点是V2吗？Q2：04蓝框短横头亮点是V2吗？可答“03／04均为V2”、分别说明或“仍看不清”。</p><h2>M3承载状态</h2><p>相邻T01–T06细M3及UP宽母线仅作为独立原生结构参照，没有用未经核实的叠加或设计相交指定载体。身份确认后再核端部、邻线和对应关系。当前模型30条金属、5个已审接口、34个设计候选孔保持。</p><script>let marked=false;function update(){let p=document.getElementById('part').value;let f=p==='m3-context'?'m3':'m2';document.getElementById('detail').src=p+'/'+f+'-detail-'+(marked?'marked':'raw')+'.png'}document.getElementById('part').onchange=update;document.getElementById('toggle').onclick=()=>{marked=!marked;update()};</script></html>
