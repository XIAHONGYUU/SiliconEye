<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三处 CT 来源归属修订</title>
<style>body{font:17px/1.7 sans-serif;background:#111a24;color:#e9eef3;max-width:1500px;margin:24px auto;padding:0 20px}a{color:#75c8ff}h1,h2{line-height:1.4}section{border:1px solid #496073;padding:20px;margin:25px 0;border-radius:10px}select,button{padding:9px;font:inherit;background:#23384b;color:white;border:1px solid #7791a6;border-radius:5px}img{display:block;max-width:100%;max-height:85vh;object-fit:contain;margin:16px auto;background:#09111a}figure{margin:10px 0}figcaption{color:#b4c3d2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.green{color:#43e686}.blue{color:#44b8ff}.purple{color:#d69aff}.red{color:#ff7777}summary{cursor:pointer}strong{color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>三处 CT 来源归属修订</h1>
<p><strong>全幅联合检查通过：16 对旧来源争用 → 0，新争用 0。</strong>仅修订73条来源记录，几何与连接结论均保留。该结果是AI来源复查工作版本，不是新增整层人工像素批准；原5处来源限制仍保留。</p>
<p><span class="red">红色：旧来源</span>；<span class="blue">蓝色：修订后的MOS源漏／栅端来源</span>；<span class="green">绿色：修订后的环来源</span>；<span class="purple">紫色：未改的相邻参考记录</span>。标记全部位于照片自身坐标，不是GDS投影；AA／M1为相同结构的独立原生视野，未经自动叠加。</p>
<p><a href="../../reviews/2026-10-21-source-ownership.md">修订说明与验收</a> · <a href="../../../benchmarks/ct-source-ownership-v1/joint-report-v1.json">全幅联合报告</a> · <a href="../../../benchmarks/ct-source-ownership-v1/ledger-v1.json">变更台账</a></p>
<div id="cases"></div>
<script>
const cases=[
{id:'S1',title:'S1：宽MOS源漏列、外围环与相邻MOS环',text:'旧外围环路径落在右边的中部MOS环上；宽MOS最右源漏列又落在了外围环上。已按完整结构区分三条亮列：蓝色为宽MOS源漏，绿色为外围环，紫色为相邻MOS环。环22条及邻接源漏44条来源修订；相邻MOS环不改。',check:'重点核对：三列身份及相对位置是否合理；几何未作平移或合并。'},
{id:'S2',title:'S2：G34-P05 下端栅CT与下面的环',text:'旧栅端搜索窗口扫到了下方环。蓝色来源已回到上方本栅的短横端部；紫色下方环记录保持。6条栅CT来源修订，孔的设计数量和几何不改；左端较弱亮点保留亮度测量，不以此宣称精确光学孔中心。',check:'重点核对：蓝色归上方栅端，紫色归下方环。'},
{id:'S3',title:'S3：相邻小MOS上下错开的源漏落点',text:'旧修订将AA4左源漏取点向下移到了AA3右源漏亮点附近。AA4来源回到上侧亮区（蓝色），AA3保留下侧亮区（紫色）。仅改1条来源，两个扩散目标及其几何均保持。',check:'重点核对：蓝色上侧与紫色下侧属于相邻MOS各自的源漏落点。'}];
const modes=[['poly-raw','POLY原图 · 宽视野'],['poly-before','POLY旧来源 · 宽视野'],['poly-after','POLY修订来源 · 宽视野'],['aa-raw','AA原图 · 独立原生视野'],['m1-raw','M1原图 · 独立原生视野']];
for(const c of cases){const s=document.createElement('section');s.innerHTML=`<h2>${c.title}</h2><p>${c.text}</p><p><strong>${c.check}</strong></p><label>切换照片与标记： <select>${modes.map(([v,t])=>`<option value="${v}" ${v==='poly-after'?'selected':''}>${t}</option>`).join('')}</select></label><figure><a class="full" href="${c.id}-poly-after.jpg" target="_blank"><img class="main" src="${c.id}-poly-after.jpg" alt="${c.title}宽视野"></a><figcaption>点击图片查看完整分辨率；保持足够相邻结构，避免仅凭单点判断。</figcaption></figure><details open><summary>修改前后局部对照（仍保留相邻结构）</summary><div class="grid"><figure><a href="${c.id}-detail-before.jpg" target="_blank"><img src="${c.id}-detail-before.jpg" alt="修订前"></a><figcaption>修订前：红色旧来源；紫色为未改参考。</figcaption></figure><figure><a href="${c.id}-detail-after.jpg" target="_blank"><img src="${c.id}-detail-after.jpg" alt="修订后"></a><figcaption>修订后：蓝／绿为新来源；紫色参考不改。</figcaption></figure></div><p><a href="${c.id}-detail-raw.jpg" target="_blank">无标记放大原图</a></p></details>`;s.querySelector('select').addEventListener('change',e=>{const p=`${c.id}-${e.target.value}.jpg`;s.querySelector('.main').src=p;s.querySelector('.full').href=p;});document.getElementById('cases').appendChild(s);}
</script></html>
